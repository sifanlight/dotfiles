# ==============================================================================
#  ✨ Modern, Aesthetic & Ergonomic Tmux Setup (Ghostty & Neovim Optimized) ✨
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Terminal, TrueColor & Ghostty Integration
# ------------------------------------------------------------------------------
# Default terminal type for 256 colors & truecolor capabilities
set -g default-terminal "tmux-256color"

# Enable TrueColor (24-bit RGB) and modern terminal features for Ghostty & xterm
set -as terminal-features ",xterm-256color:RGB:usstyle:extkeys:sync:hyperlinks:clipboard:sixel"
set -as terminal-features ",xterm-ghostty:RGB:usstyle:extkeys:sync:hyperlinks:clipboard:sixel"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Enable undercurls and colored underlines (vital for Neovim LSP diagnostics in Ghostty)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow passthrough for Kitty graphics protocol (enables images in Yazi, Neovim image.nvim, etc.)
set -g allow-passthrough on

# Native OSC 52 clipboard integration with Ghostty
set -s set-clipboard on

# Extended keys for full modifier support (CSI u / Kitty keyboard protocol)
set -g extended-keys on

# Focus events enabled for terminals that support them (vital for vim autoread)
set -g focus-events on

# Zero delay for escape key press (instant Insert -> Normal mode in Vim/Neovim)
set -s escape-time 0

# ------------------------------------------------------------------------------
# 2. General Ergonomics & Settings
# ------------------------------------------------------------------------------
# Remap prefix from 'C-b' to 'C-a' (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window and pane numbering at 1 instead of 0 (matches keyboard number row)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Enable full mouse support (clicking, resizing, scrolling)
set -g mouse on

# Increase scrollback buffer size
set -g history-limit 50000

# Increase tmux messages display duration (3 seconds)
set -g display-time 3000

# Refresh status line every 5 seconds
set -g status-interval 5

# Set terminal window title to reflect current session and window
set -g set-titles on
set -g set-titles-string "#S : #W"

# Modern rounded pane borders (Tmux 3.3+)
#set -g pane-border-lines rounded

# ------------------------------------------------------------------------------
# 3. Keybindings & Navigation
# ------------------------------------------------------------------------------
# Quick configuration reload with <prefix> + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message " ✨ Tmux config reloaded!"

# Split panes using | and - (and preserve current working directory)
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Open new window in current working directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (alongside vim-tmux-navigator)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (repeatable without pressing prefix again: <prefix> + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle pane zoom (maximize / restore) with <prefix> + m or <prefix> + z
bind m resize-pane -Z

# Switch windows without prefix using Shift + Left/Right arrows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Swap current window position left/right with <prefix> + < and <prefix> + >
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Synchronize all panes in current window with <prefix> + y
bind y set-window-option synchronize-panes\; display-message " 󰌌 Synchronize panes: #{?pane_synchronized,ON,OFF}"

# ------------------------------------------------------------------------------
# 4. Floating Popups (Modern Tmux Feature)
# ------------------------------------------------------------------------------
# Aesthetic fuzzy session switcher popup with live preview (<prefix> + S)
bind S display-popup -E -w 75% -h 60% "\
  tmux list-sessions -F '#{session_name}' | \
  fzf --reverse --header '⚡ Switch Tmux Session' \
      --preview 'tmux capture-pane -ep -t {}' \
      --preview-window 'right:60%' | \
  xargs tmux switch-client -t"

# Floating scratchpad terminal popup (<prefix> + C-t)
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 75% -E "$SHELL"

# Floating Yazi file manager popup (<prefix> + C-y)
bind C-y display-popup -d "#{pane_current_path}" -w 85% -h 80% -E "yazi"

# ------------------------------------------------------------------------------
# 5. Vi Copy Mode (Ghostty & System Clipboard Ready)
# ------------------------------------------------------------------------------
set-window-option -g mode-keys vi

# Use 'v' to begin selection and 'C-v' for rectangle block select in copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Do not jump to bottom on mouse drag selection end
unbind -T copy-mode-vi MouseDragEnd1Pane

# ------------------------------------------------------------------------------
# 6. Catppuccin Mocha Theme & Status Bar Styling
# ------------------------------------------------------------------------------
# Position status bar at the top (clean, modern tab look)
set -g status-position top

# Catppuccin v2.1.2 options
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text " #W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, 󰁌,}"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text " #{b:pane_current_path}"
set -g @catppuccin_date_time_text " %H:%M"

# ------------------------------------------------------------------------------
# 7. Plugins (TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic restore of last saved session
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'

# ------------------------------------------------------------------------------
# 8. Initialize Theme & Status Line Configuration
# ------------------------------------------------------------------------------
# Load Catppuccin theme
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# Status modules styling (placed after catppuccin loads)
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
