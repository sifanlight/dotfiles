# Feed Noctalia's wallpaper palette into Catppuccin.
#
# Catppuccin only sets its @thm_* colors when they are still unset (set -o),
# so defining them here, before catppuccin.tmux runs, makes the whole status
# bar use Noctalia's colors instead of Mocha's.
#
# Sourced from tmux.conf right before the Catppuccin `run` line. Kept in its
# own file because Noctalia's tmux hook moves any line that sources
# themes/noctalia.conf to the end of tmux.conf, which is too late for this.
# ~/.local/bin/tmux-noctalia-reload re-applies it when the palette changes.

source-file -q ~/.config/tmux/themes/noctalia.conf

if -F '#{@noctalia_primary}' {
    set -gF @thm_bg        "#{@noctalia_surface}"
    set -gF @thm_fg        "#{@noctalia_on_surface}"

    # Accents
    set -gF @thm_rosewater "#{@noctalia_on_secondary_container}"
    set -gF @thm_flamingo  "#{@noctalia_on_secondary_container}"
    set -gF @thm_pink      "#{@noctalia_on_secondary_container}"
    set -gF @thm_mauve     "#{@noctalia_primary}"
    set -gF @thm_lavender  "#{@noctalia_primary}"
    set -gF @thm_blue      "#{@noctalia_primary}"
    set -gF @thm_sapphire  "#{@noctalia_primary}"
    set -gF @thm_sky       "#{@noctalia_primary}"
    set -gF @thm_teal      "#{@noctalia_on_tertiary_container}"
    set -gF @thm_green     "#{@noctalia_on_tertiary_container}"
    set -gF @thm_yellow    "#{@noctalia_on_primary_container}"
    set -gF @thm_peach     "#{@noctalia_on_primary_container}"
    set -gF @thm_red       "#{@noctalia_on_error_container}"
    set -gF @thm_maroon    "#{@noctalia_on_error_container}"

    # Text, overlays and surfaces
    set -gF @thm_subtext_1 "#{@noctalia_on_surface_variant}"
    set -gF @thm_subtext_0 "#{@noctalia_on_surface_variant}"
    set -gF @thm_overlay_2 "#{@noctalia_outline}"
    set -gF @thm_overlay_1 "#{@noctalia_outline}"
    set -gF @thm_overlay_0 "#{@noctalia_outline_variant}"
    set -gF @thm_surface_2 "#{@noctalia_surface_container_highest}"
    set -gF @thm_surface_1 "#{@noctalia_surface_container_high}"
    set -gF @thm_surface_0 "#{@noctalia_surface_container}"
    set -gF @thm_mantle    "#{@noctalia_surface_container_low}"
    set -gF @thm_crust     "#{@noctalia_surface}"

    # Make the selected tab stand out: Catppuccin's default only lifts its
    # background from surface_0 to surface_1, which is a barely visible step
    # in Noctalia's dark palettes. Give it the accent container instead.
    set -gF @catppuccin_window_current_text_color   "#{@noctalia_primary_container}"
    set -gF @catppuccin_window_current_number_color "#{@noctalia_primary}"
}
