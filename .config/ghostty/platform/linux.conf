# Linux / KDE Plasma settings.
# Linked as platform/current.conf by install.sh on Linux.

# Let KWin draw the titlebar so Plasma window decorations, themes, and
# window rules apply. Use `none` for a borderless window instead.
window-decoration = server

# Traditional titlebar with a separate tab bar below it, which matches
# Konsole's layout more closely than the merged `tabs` style.
gtk-titlebar-style = native
gtk-tabs-location  = top
gtk-wide-tabs      = false

# Mirror of the macOS Cmd+Ctrl+T binding (Super is the Cmd-position key).
# If KDE has already claimed this chord, rebind it in System Settings >
# Shortcuts, or change it here.
keybind = super+ctrl+t=new_window

# Keep the quick terminal above normal windows. Wayland only; on X11 the
# quick terminal falls back to an ordinary window.
gtk-quick-terminal-layer = top

# Put Ghostty's own processes in a systemd cgroup so a runaway command
# can't starve the rest of the session. Harmless if systemd isn't in use.
linux-cgroup = single-instance
