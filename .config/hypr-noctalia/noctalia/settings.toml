[dock]
background_opacity = 0.67999998480081558
enabled = false
icon_size = 32
main_axis_padding = 15
margin_edge = 5
reserve_space = false
show_dots = true
smart_auto_hide = true

[hot_corners.top_left]
action = "window_switcher"

[idle]
behavior_order = [ "dim", "kbd-backlight", "lock", "screen-off", "suspend" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.dim]
    action = "command"
    command = "brightnessctl -s set 10"
    resume_command = "brightnessctl -r"
    timeout = 150

    [idle.behavior.kbd-backlight]
    action = "command"
    command = "brightnessctl -s -d asus::kbd_backlight set 0"
    resume_command = "brightnessctl -r -d asus::kbd_backlight"
    timeout = 150

    [idle.behavior.lock]
    action = "lock"
    timeout = 300

    [idle.behavior.screen-off]
    action = "screen_off"
    timeout = 330

    [idle.behavior.suspend]
    action = "suspend"
    lock_before_suspend = true
    timeout = 1800

