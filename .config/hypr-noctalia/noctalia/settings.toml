[weather]
refresh_minutes = 60

[widget.active_window]
display = "icon_only"
icon_size = 19
max_length = 276
min_length = 0

[widget.battery]
display_mode = "graphic"
hide_when_full = true

[widget.clock]
format = "{:%a %b %d  •  %H:%M}"

[widget.gamermode]
type = "nomadcxx/gamer-mode:gamermode"

[widget.gamermode_2]
type = "nomadcxx/gamer-mode:gamermode"

[widget.launcher]
glyph = "menu-2"

[widget.media]
album_art_only = true
art_size = 26
title_scroll = "always"

[widget.network]
show_label = false
vpn_status = "both"

[widget.now-playing]
enable_scroll = false
hide_album_art = true
type = "tranzem/media-lyrics:now-playing"

[widget.workspaces]
show_icons = false